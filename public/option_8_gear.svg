<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept E: The Mechanized Gear (Meaning: The Machinery of Productivity) -->
  <g stroke="black" fill="none">
    <!-- Main Asymmetric Cog/Gear -->
    <g transform="translate(256, 256)">
      <!-- Irregular teeth to give it that "weird" and complex feel -->
      <path d="M0 -220 L 30 -220 L 40 -180 A 180 180 0 0 1 120 -140 L 150 -160 L 180 -130 L 150 -100 A 180 180 0 0 1 180 50 L 220 60 L 210 100 L 170 90 A 180 180 0 0 1 50 170 L 40 210 L 0 210 L -10 170 A 180 180 0 0 1 -150 100 L -190 110 L -200 70 L -160 60 A 180 180 0 0 1 -170 -100 L -210 -110 L -200 -150 L -160 -140 A 180 180 0 0 1 -50 -180 L -40 -220 Z" stroke-width="4"/>
      
      <!-- Internal Complex Gear Rims -->
      <circle r="140" stroke-width="2"/>
      <circle r="130" stroke-dasharray="2 6"/>
      
      <!-- The "Clockwork" precision blades -->
      <g stroke-width="0.5" opacity="0.6">
        <path d="M0 -130 V 130" /><path d="M-130 0 H 130" />
        <path d="M-92 -92 L 92 92" /><path d="M92 -92 L -92 92" />
      </g>
      
      <!-- Focal Pivot -->
      <circle r="40" fill="white" stroke="black" stroke-width="2"/>
      <circle r="15" fill="black"/>
    </g>
    
    <!-- Technical Background (Time calibration lines) -->
    <g opacity="0.1" stroke-width="0.5">
       <circle cx="256" cy="256" r="250" />
       <path d="M256 0 V 512" /><path d="M0 256 H 512" />
    </g>
  </g>
</svg>
