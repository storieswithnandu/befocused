<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept C: The Structural Lattice (Meaning: Purposeful Complexity) -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Asymmetric Block Accumulation -->
    <!-- Represents the building blocks of focus -->
    <rect x="100" y="100" width="150" height="200" stroke-width="6"/>
    <rect x="230" y="150" width="180" height="220" stroke-width="4"/>
    <rect x="180" y="280" width="120" height="150" stroke-width="2"/>
    
    <!-- Intricate internal hatching and cross-sections -->
    <g opacity="0.5" stroke-width="0.8">
      <line x1="100" y1="110" x2="250" y2="110" /><line x1="100" y1="120" x2="250" y2="120" />
      <line x1="240" y1="150" x2="240" y2="370" /><line x1="250" y1="150" x2="250" y2="370" />
      <!-- Diagonal structural support lines -->
      <line x1="100" y1="100" x2="410" y2="370" stroke-width="0.3"/>
      <line x1="410" y1="150" x2="100" y2="300" stroke-width="0.3"/>
    </g>
    
    <!-- Focal Node (The "Point" of Focus) -->
    <g transform="translate(250, 250)">
      <circle r="30" fill="white" stroke="black" stroke-width="3"/>
      <circle r="15" fill="black"/>
      <!-- Measurement ticks -->
      <path d="M0 -40 V -25" /><path d="M40 0 H 25" />
      <path d="M0 40 V 25" /><path d="M-40 0 H -25" />
    </g>
  </g>
</svg>
