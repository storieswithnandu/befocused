<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept G: The Precision Target (Meaning: Absolute Focus / Hitting Goals) -->
  <g transform="translate(256, 256)" stroke="black" fill="none">
    <!-- Complex multi-layered off-center target -->
    <g transform="translate(40, -40)">
      <circle r="180" stroke-width="0.5" opacity="0.2"/>
      <circle r="150" stroke-width="4"/>
      <circle r="130" stroke-dasharray="5 15" opacity="0.5"/>
      
      <!-- The "Checking-off" detail (The Productivity Check) -->
      <!-- Abstracted into a structural precision node -->
      <g transform="translate(-80, 80) rotate(-45)">
         <path d="M-40 0 H 40" stroke-width="8" stroke-linecap="square"/>
         <path d="M0 -40 V 40" stroke-width="8" stroke-linecap="square"/>
      </g>
      
      <!-- Focal core -->
      <circle r="40" fill="white" stroke="black" stroke-width="2"/>
      <circle r="15" fill="black"/>
      
      <!-- Measurement crosshairs -->
      <g stroke-width="0.3" opacity="0.8">
         <path d="M-200 0 H 200" stroke-dasharray="1 2"/>
         <path d="M0 -200 V 200" stroke-dasharray="1 2"/>
      </g>
    </g>
    
    <!-- Asymmetric background alignment -->
    <path d="M-256 0 H 256" stroke-width="0.1" opacity="0.1"/>
    <path d="M0 -256 V 256" stroke-width="0.1" opacity="0.1"/>
    <circle r="250" stroke-width="1" opacity="0.05"/>
  </g>
</svg>
