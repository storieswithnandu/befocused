<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept H: The Staggered Timeline (Meaning: Milestones & Organization) -->
  <g stroke="black" fill="none">
    <!-- Asymmetric sequence of "Time Nodes" -->
    <path d="M50 400 L 150 350 L 256 380 L 350 250 L 450 200" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dense architectural detail on each node -->
    <g transform="translate(150, 350)">
      <circle r="30" stroke-width="0.5"/>
      <circle r="25" stroke-dasharray="1 3"/>
      <path d="M-30 0 H 30" opacity="0.4"/>
    </g>
    <g transform="translate(350, 250)">
      <!-- This is the "Focus" Milestone -->
      <circle r="60" stroke-width="4"/>
      <circle r="70" stroke-width="0.5" stroke-dasharray="2 6"/>
      <circle r="15" fill="black"/>
      <!-- Internal "Checkmark" geometry (Asymmetric/Professional) -->
      <path d="M-30 10 L -10 30 L 40 -20" stroke-width="6" stroke-linecap="round"/>
    </g>
    
    <!-- Technical Flow Lines (Meaning: Momentum) -->
    <g opacity="0.3" stroke-width="0.5">
      <path d="M50 400 Q 256 250 450 200" />
      <path d="M50 400 Q 256 450 450 200" />
      <path d="M150 350 L 150 512" stroke-dasharray="5 5"/>
      <path d="M350 250 L 350 0" stroke-dasharray="5 5"/>
    </g>

    <!-- Calibration Markings (The Complexity) -->
    <g transform="translate(480, 50)" opacity="0.4">
      <path d="M-40 0 H 0 V 40" stroke-width="2"/>
      <path d="M-20 5 V 15" /><path d="M-25 5 V 15" />
    </g>
  </g>
</svg>
