<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Option 12: The Layered Achievement (Blueprint for Success) -->
  <g transform="translate(50, 50)" stroke="black" fill="none">
    <!-- Asymmetric stacking of "task planes" -->
    <!-- Creating an architectural sense of depth and completion -->
    <path d="M50 100 L 350 40 L 420 300 L 120 360 Z" stroke-width="4"/>
    <path d="M70 120 L 330 70 L 400 320 L 140 370 Z" stroke-width="1.5" opacity="0.6"/>
    <path d="M90 140 L 310 100 L 380 340 L 160 380 Z" stroke-width="0.5" opacity="0.4"/>

    <!-- Vertical "Structural" pillars (Support of productivity) -->
    <line x1="120" y1="360" x2="120" y2="450" stroke-width="4"/>
    <line x1="420" y1="300" x2="420" y2="390" stroke-width="0.5" opacity="0.2"/>
    
    <!-- The "Focus Core" (Precision alignment through layers) -->
    <g transform="translate(260, 200)">
      <circle r="60" stroke-width="2"/>
      <circle r="75" stroke-dasharray="1 10" opacity="0.5"/>
      <circle r="15" fill="black"/>
      <!-- Technical "Depth" lines -->
      <path d="M0 0 L 150 -150" stroke-width="0.3" opacity="0.3"/>
      <path d="M0 0 L -250 250" stroke-width="0.3" opacity="0.3"/>
    </g>

    <!-- Data calibration markers on the edges -->
    <g opacity="0.3" stroke-width="1">
       <path d="M0 0 H 20 M 0 10 H 15 M 0 20 H 20" />
       <path d="M412 412 V 390 M 402 412 V 400" />
    </g>
  </g>
</svg>
