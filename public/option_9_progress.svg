<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept F: The Progress Spiral (Meaning: Successive Growth) -->
  <g stroke="black" fill="none">
    <!-- Asymmetric upward spiral of blocks -->
    <path d="M100 450 H 412" stroke-width="4" stroke-linecap="round"/> <!-- Ground line -->
    
    <!-- Blocks of achievement -->
    <rect x="120" y="380" width="60" height="70" stroke-width="3"/>
    <rect x="190" y="320" width="80" height="130" stroke-width="4"/>
    <rect x="280" y="220" width="100" height="230" stroke-width="2" opacity="0.8"/>
    <rect x="330" y="100" width="50" height="350" stroke-width="1" opacity="0.6"/>
    
    <!-- The "Goal" Node (Celestial alignment) -->
    <g transform="translate(355, 60)">
      <circle r="30" stroke-width="2.5"/>
      <circle r="40" stroke-dasharray="1 4" opacity="0.5"/>
      <circle r="8" fill="black"/>
      <!-- Rays of focus -->
      <path d="M0 40 V 390" stroke-width="0.5" stroke-dasharray="5 5" opacity="0.3"/>
    </g>
    
    <!-- Intricate connective data-web -->
    <g opacity="0.4" stroke-width="0.3">
      <path d="M120 380 L 355 60" />
      <path d="M190 320 L 355 60" />
      <path d="M280 220 L 355 60" />
      <circle cx="230" cy="200" r="4" fill="black"/>
      <path d="M230 200 L 355 60" />
    </g>
    
    <!-- Measurement ticks on the side -->
    <g transform="translate(60, 450)" opacity="0.3">
      <line x1="0" y1="0" x2="0" y2="-400" />
      <line x1="0" y1="-100" x2="10" y2="-100" />
      <line x1="0" y1="-200" x2="10" y2="-200" />
      <line x1="0" y1="-300" x2="10" y2="-300" />
    </g>
  </g>
</svg>
