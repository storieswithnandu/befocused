<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Concept A: The Topographical Peak (Meaning: Pinnacle of Focus) -->
  <g stroke="black" stroke-width="1" fill="none">
    <!-- Irregular, asymmetric elevation lines -->
    <path d="M400 300 C 450 250, 480 150, 420 80 S 250 20, 150 60 S 20 150, 40 250 S 150 480, 256 490 S 400 400, 400 300" stroke-width="3"/>
    <path d="M380 280 C 420 230, 440 160, 390 100 S 240 50, 160 80 S 50 160, 70 240 S 160 440, 256 450 S 380 340, 380 280" opacity="0.8"/>
    <path d="M350 260 C 380 210, 390 170, 350 120 S 230 80, 170 100 S 80 170, 100 230 S 170 380, 256 390 S 350 300, 350 260" opacity="0.6"/>
    <path d="M310 240 C 330 200, 330 180, 300 140 S 220 110, 180 130 S 120 180, 140 220 S 180 310, 256 320 S 310 270, 310 240" stroke-width="0.5"/>
    <path d="M280 230 C 290 210, 290 200, 275 160 S 210 140, 190 160 S 150 200, 170 230 S 210 260, 256 265 S 280 245, 280 230" stroke-width="1.5"/>
    
    <!-- Fracture lines (The "complicated" detail) -->
    <g opacity="0.3" stroke-width="0.3">
      <path d="M256 265 L 480 300" /><path d="M256 265 L 420 80" />
      <path d="M256 265 L 150 60" /><path d="M256 265 L 40 250" />
      <path d="M256 265 L 256 492" />
