<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="white"/>
  <!-- Option 3: The Technical Shutter -->
  <g transform="translate(256, 256)" stroke="black" stroke-width="1" fill="none">
    <circle r="230" stroke-width="4"/>
    <circle r="215" stroke-width="0.5" stroke-dasharray="2 10"/>
    <!-- Shutter Blades -->
    <path d="M0 -230 L 150 -100" opacity="0.8"/>
    <path d="M150 -100 L 230 50" opacity="0.6"/>
    <path d="M230 50 L 50 230" opacity="0.8"/>
    <path d="M50 230 L -150 100" opacity="0.6"/>
    <path d="M-150 100 L -230 -50" opacity="0.8"/>
    <path d="M-230 -50 L -100 -200" opacity="0.6"/>
    <!-- Measurement marks -->
    <g opacity="0.4">
      <path d="M0 -230 V -210" transform="rotate(0)"/><path d="M0 -230 V -210" transform="rotate(30)"/>
      <path d="M0 -230 V -210" transform="rotate(60)"/><path d="M0 -230 V -210" transform="rotate(90)"/>
    </g>
    <circle r="60" fill="black"/>
    <circle r="50" stroke="white" stroke-width="0.5"/>
  </g>
</svg>
